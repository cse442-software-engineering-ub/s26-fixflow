<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FixFlow - Change Password</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a class="brand" href="home.html">
      <img class="brand-logo" src="logo.png" alt="FixFlow logo">
      <span class="brand-text">FixFlow</span>
    </a>

    <a class="user-pill" href="profile.html">
      <div class="user-avatar"></div>
      <div>Sanjay</div>
      <div class="caret">▼</div>
    </a>
  </div>

  <div class="container">

    <a class="back" href="profile.html">← Back</a>

    <div class="card section" style="margin-top:20px; padding:40px;">

      <div style="max-width:800px; margin:auto;">

        <div style="margin-bottom:24px;">
          <div style="margin-bottom:8px; font-weight:600;">Type in Old Password</div>
          <input class="input" type="password">
        </div>

        <div style="margin-bottom:24px;">
          <div style="margin-bottom:8px; font-weight:600;">Type in New Password</div>
          <input class="input" type="password">
        </div>

        <div style="margin-bottom:40px;">
          <div style="margin-bottom:8px; font-weight:600;">Retype in New Password</div>
          <input class="input" type="password">
        </div>

        <div style="text-align:right;">
          <a class="btn small" href="profile.html">Update User Profile</a>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
