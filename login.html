<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FixFlow - Login</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div style="width:100%; max-width:520px;">

      <!-- Logo + Title -->
      <div class="auth-head">
        <img class="logo" src="logo.png" alt="FixFlow logo">
        <div class="h1" style="margin:0;">FixFlow</div>
      </div>

      <!-- Card -->
      <div class="auth-card" style="max-width:520px; margin:0 auto;">
        <div class="auth-title">LOGIN</div>

        <div style="display:flex; flex-direction:column; gap:16px;">
          <div class="field">
            <label>Username</label>
            <input id="username" class="input" type="text" placeholder="Enter Username" autocomplete="username">
          </div>

          <div class="field">
            <label>Password</label>
            <input id="password" class="input" type="password" placeholder="Enter Password" autocomplete="current-password">
          </div>

          <!-- Continue -->
          <div style="display:flex; justify-content:center; margin-top:6px;">
            <button id="loginBtn" class="helper-link"
              style="font-size:18px; background:none; border:none; cursor:pointer;">
              Continue
            </button>
          </div>

          <!-- Sign Up -->
          <div style="display:flex; justify-content:center;">
            <a class="helper-link" href="signup.html" style="font-size:18px;">New User? Sign Up</a>
          </div>

          <!-- Forgot Password -->
          <div style="display:flex; justify-content:flex-start; margin-top:10px;">
            <a class="helper-link" href="reset.html">Forgot Password? →</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    async function doLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!username || !password) {
        alert("Please fill in all fields.");
        return;
      }

      try {
        const res = await fetch("login.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password })
        });

        const data = await res.json().catch(() => ({}));

        if (data.success) {
          window.location.href = "home.html";
        } else {
          alert(data.message || "Invalid credentials.");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Something went wrong. Please try again.");
      }
    }

    document.getElementById("loginBtn").addEventListener("click", doLogin);

    // Optional: Enter key to login
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>
</html>
