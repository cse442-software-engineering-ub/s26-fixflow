<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FixFlow - Profile</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <a class="brand" href="home.html">
      <img class="brand-logo" src="logo.png" alt="FixFlow logo">
      <span class="brand-text">FixFlow</span>
    </a>

    <!-- On profile page, can stay non-clickable -->
    <div class="user-pill" style="cursor:default; text-decoration:none; color:#111;">
      <div class="user-avatar"></div>
      <div id="topbarName">Sanjay</div>
      <div class="caret">▼</div>
    </div>
  </div>

  <div class="container">
    <a class="back" href="home.html">← Back</a>

    <div class="h1">Update Your Profile</div>

    <div class="card section" style="padding:26px;">
      <div class="row" style="align-items:center; justify-content:space-between; gap:24px;">

        <!-- left: avatar + name -->
        <div style="display:flex; align-items:center; gap:22px;">
          <div style="width:120px;height:120px;border-radius:999px;background:#d8d8d8;"></div>

          <div>
            <div id="displayName" style="font-size:34px; font-weight:900; margin-bottom:6px;">Sanjay</div>

            <!-- clickable edit -->
            <button id="editBtn"
              style="border:0; background:transparent; padding:0; font-size:14px; color:var(--muted); cursor:pointer; text-decoration:underline;">
              edit
            </button>
          </div>
        </div>

        <!-- right: delete button (go to confirmation page) -->
        <a href="user-deleted.html"
           style="background:#ef7d7d; color:#111; padding:10px 18px; border-radius:8px; text-decoration:none; font-weight:800;">
          Delete User Profile
        </a>
      </div>

      <div style="height:18px;"></div>

      <!-- form fields -->
      <div style="display:grid; grid-template-columns: 160px 1fr; gap:14px 16px; align-items:center;">

        <div style="font-weight:700;">Change Email :</div>
        <input id="emailInput" class="input" style="border-radius:8px; height:40px; background:#e9ecef; border:0;"
               placeholder=""/>

        <div style="font-weight:700;">Change Username :</div>
        <input id="usernameInput" class="input" style="border-radius:8px; height:40px; background:#e9ecef; border:0;"
               placeholder=""/>

        <div style="font-weight:700;">Phone Number :</div>
        <input id="phoneInput" class="input" style="border-radius:8px; height:40px; background:#e9ecef; border:0;"
               placeholder=""/>

        <div style="font-weight:800; align-self:start; margin-top:6px;">About Me</div>
        <textarea id="aboutInput" class="input" style="border-radius:8px; min-height:64px; padding-top:10px; background:#e9ecef; border:0;"
                  placeholder="Write about yourself ..."></textarea>

      </div>

      <div style="height:26px;"></div>

      <!-- bottom buttons -->
      <div class="row" style="justify-content:space-between; align-items:center;">
        <a class="btn" href="change-password.html" style="width:220px;">Change Password</a>

        <!-- Save via API then redirect -->
        <button type="button" id="saveBtn" class="btn" style="width:220px;">Update User Profile</button>
      </div>
      <div id="profileError" style="color:#c00; margin-top:8px; display:none;"></div>

    </div>
  </div>

  <script>
    const displayNameEl = document.getElementById("displayName");
    const topbarNameEl  = document.getElementById("topbarName");
    const emailInput    = document.getElementById("emailInput");
    const usernameInput = document.getElementById("usernameInput");
    const phoneInput    = document.getElementById("phoneInput");
    const aboutInput   = document.getElementById("aboutInput");
    const editBtn      = document.getElementById("editBtn");
    const saveBtn      = document.getElementById("saveBtn");
    const profileError = document.getElementById("profileError");

    function showError(msg) {
      profileError.textContent = msg || "";
      profileError.style.display = msg ? "block" : "none";
    }

    // Load profile from backend (requires same-origin + session cookie)
    async function loadProfile() {
      try {
        const res = await fetch("api/profile_get.php", { credentials: "include" });
        if (res.status === 401) {
          window.location.href = "login.html";
          return;
        }
        if (!res.ok) {
          showError("Could not load profile.");
          return;
        }
        const data = await res.json();
        const u = data.user || {};
        const name = u.full_name || u.username || "User";
        displayNameEl.textContent = name;
        topbarNameEl.textContent = name;
        emailInput.value = u.email || "";
        usernameInput.value = u.username || "";
        phoneInput.value = u.phone || "";
        aboutInput.value = u.about_me || "";
      } catch (e) {
        showError("Failed to load profile. Are you logged in?");
      }
    }

    loadProfile();

    // Live update display name while typing username (profile uses username as display if no full_name)
    usernameInput.addEventListener("input", () => {
      const v = usernameInput.value.trim() || displayNameEl.textContent;
      displayNameEl.textContent = v;
      topbarNameEl.textContent = v;
    });

    editBtn.addEventListener("click", () => {
      usernameInput.focus();
      usernameInput.select();
    });

    saveBtn.addEventListener("click", async () => {
      showError("");
      const payload = {
        full_name: displayNameEl.textContent.trim() || usernameInput.value.trim(),
        email: emailInput.value.trim(),
        username: usernameInput.value.trim(),
        phone: phoneInput.value.trim(),
        about_me: aboutInput.value.trim()
      };
      try {
        const res = await fetch("api/profile_update.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          showError(data.message || "Update failed.");
          return;
        }
        window.location.href = "profile-updated.html";
      } catch (e) {
        showError("Network error. Try again.");
      }
    });
  </script>

</body>
</html>
